workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (CocoaPods only)
        script: flutter config --no-enable-swift-package-manager
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods install
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
