name: quick_pdf_tool
description: Quick PDF Tool — images to PDF, OCR, and PDF compression.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^10.1.4
  pdf: ^3.11.3
  printing: ^5.14.2
  google_mlkit_text_recognition: ^0.14.0
  # pub.dev 0.0.5 ships broken Android/iOS plugin stubs — use local Dart-only package.
  file_compression_plus:
    path: packages/file_compression_plus
  permission_handler: ^11.3.1
  google_mobile_ads: ^5.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # CocoaPods only — avoids google_mobile_ads vs webview_flutter_wkwebview SPM conflict on iOS.
  config:
    enable-swift-package-manager: false
